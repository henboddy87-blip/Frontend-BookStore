er:"Farrar, Straus and Giroux",publishedYear:2018,isbn:"9780374168650",language:"English",format:"Paperback",description:"Set on the desert planet Arrakis, Dune is the story of the boy Paul Atreides, heir to a noble family tasked with ruling an inhospitable world where the only thing of value is the spice melange, a drug capable of extending life and enhancing consciousness.",isBestseller:!0,inStock:!0,stockCount:988,tags:["math","problem-solving","mindset","critical thinking"]},{id:168,title:"Life in Science",author:"Katalin Karikó",price:36.99,image:"https://media.springernature.com/full/springer-static/cover-hires/book/978-3-031-23717-1",images:["https://media.springernature.com/full/springer-static/cover-hires/book/978-3-031-23717-1"],category:"science",genre:"Biography & Science",rating:4.8,reviews:45678,pages:336,publisher:"Crown",publishedYear:2023,isbn:"9780593443163",language:"English",format:"Paperback",description:"Breaking Through is an inspiring story of resilience. Karikó grew up in postwar communist Hungary and moved to the US with very little money. For decades, her research into mRNA was dismissed, defunded, and ignored by the scientific establishment. The book details her refusal to give up, eventually leading to the discovery that saved millions of lives during the pandemic",isBestseller:!0,inStock:!0,stockCount:167,tags:["Nobel Prize","mRNA","Biochemistry","Perseverance"]},{id:169,title:"Blueprint",author:"Robert Plomin",price:46.99,image:"https://i.pinimg.com/736x/e4/c2/c6/e4c2c6dd4e49c7cda838c9b78cf91d63.jpg",images:["https://i.pinimg.com/736x/e4/c2/c6/e4c2c6dd4e49c7cda838c9b78cf91d63.jpg"],category:"science",genre:"Non-fiction & Science",rating:4.8,reviews:46789,pages:280,publisher:"MIT Press / Allen Lane",publishedYear:2018,isbn:"9780262039161",language:"English",format:"Paperback",description:"The book introduces the concept of 'The Polygenic Score'—the ability to predict a person's psychological strengths and weaknesses just by looking at their DNA. Plomin’s most controversial take is that 'environmental' factors (like parenting and schooling) often matter far less than we think, because our genes actually drive us to pick the environments that suit our natural inclinations. It’s a thought-provoking read that completely flips the traditional 'nature vs. nurture' debate on its head.",isBestseller:!0,inStock:!0,stockCount:89,tags:["Behavioral Genetics","Nature vs Nurture","DNA","Psychology"]},{id:170,title:"Behave",author:"Robert Sapolsky",price:24.99,image:"https://i.pinimg.com/736x/3b/2a/e9/3b2ae91ec80afd9e032065ac02fcd430.jpg",images:["https://i.pinimg.com/736x/3b/2a/e9/3b2ae91ec80afd9e032065ac02fcd430.jpg"],category:"science",genre:"Non-fiction & Science",rating:4.8,reviews:45689,pages:790,publisher:"Penguin Press",publishedYear:2017,isbn:"9781594205071",language:"English",format:"Paperback",description:"Robert Sapolsky, a neurobiologist and primatologist, tackles the complex question of human behavior by looking at it through different 'time lenses.' He starts with what happens in the brain a second before an action (neurobiology), then moves back to minutes (sensory cues), hours to days (hormones), and eventually centuries (culture and evolution).",isBestseller:!0,inStock:!0,stockCount:198,tags:["Neurobiology","Psychology","Human Behavior","Endocrinology"]},{id:171,title:"A Short History of Nearly Everything",author:"Bill Bryson",price:19.99,image:"https://i.pinimg.com/736x/8b/64/ad/8b64ad2984af5fc03a7b0ad0b10a9aae.jpg",images:["https://i.pinimg.com/736x/8b/64/ad/8b64ad2984af5fc03a7b0ad0b10a9aae.jpg"],category:"science",genre:"Science",rating:4.8,reviews:56789,pages:544,publisher:"Broadway Books / Transworld",publishedYear:2003,isbn:"9780767908184",language:"English",format:"Paperback",description:"The book is famous for its humor and its focus on the people behind the science—the eccentric, obsessive, and sometimes brilliant individuals who made the discoveries. It covers everything from the Big Bang and the size of the universe to the dangers of yellowstone’s supervolcano and the weirdness of the atomic world. It’s the ultimate 'overview' book that makes even the most intimidating subjects feel like a witty conversation.",isBestseller:!0,inStock:!0,stockCount:155,tags:["General Science","Astronomy","Earth Sciences","Physics"]},{id:172,title:"Life on the Edge",author:"Jim AI-Khalili & Johnjoe Mcfadden",price:15.99,image:"https://i.pinimg.com/1200x/bc/d3/83/bcd38371fa0350e860d6e81efe2379fd.jpg",images:["https://i.pinimg.com/1200x/bc/d3/83/bcd38371fa0350e860d6e81efe2379fd.jpg"],category:"science",genre:"Non-fiction & Popular Science",rating:4.8,reviews:45678,pages:353,publisher:"Bantam Press / Crown Publishers",publishedYear:2014,isbn:"9780307986818",language:"English",format:"Paperback",description:"The book uses vivid storytelling to explain complex phenomena, such as how European Robins use quantum entanglement in their eyes to 'see' the Earth's magnetic field during migration, or how plants use quantum superposition to achieve nearly 100% efficiency in photosynthesis. It even touches on the role of quantum tunneling in DNA mutations and enzymes. It is a groundbreaking look at how the most fundamental laws of physics might be the very thing that differentiates 'life' from 'dead matter.'",isBestseller:!0,inStock:!0,stockCount:320,tags:["Quantum Biology","Genetics","Neuroscience","Photosynthesis"]},{id:173,title:"The Neanderthals Rediscovered",author:"Dimitra Papagianni & Michael A. Morse",price:45.99,image:"https://i.pinimg.com/1200x/ae/5f/6d/ae5f6d9c214607d27ffa4080ad9f19f6.jpg",images:["https://i.pinimg.com/1200x/ae/5f/6d/ae5f6d9c214607d27ffa4080ad9f19f6.jpg"],category:"science",genre:"Non-fiction & Popular Science",rating:4.8,reviews:456789,pages:256,publisher:"Thames & Hudson",publishedYear:2015,isbn:"9780500292044",language:"English",format:"Paperback",description:"The authors trace the Neanderthal lineage back nearly a million years, showing that they were actually highly successful, resilient survivors who navigated ice ages, created art, buried their dead, and likely had a form of language. Most importantly, it covers the 'interbreeding' discovery—proving that most modern humans still carry Neanderthal DNA today. It’s a fast-paced narrative that moves from the first fossil discoveries in the 19th century to the cutting-edge genomic breakthroughs of the 21st.",isBestseller:!0,inStock:!0,stockCount:97,tags:["Archaeology","Anthropology","Prehistory","Human Evolution"]},{id:174,title:"IN SEARCH OF SCHRODINGER'S CAT",author:"John Gribbin",price:32.99,image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMA8EzBT7MRunhOUkP2bRZNLwmskHpVppFgg&s",images:["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMA8EzBT7MRunhOUkP2bRZNLwmskHpVppFgg&s"],category:"science",genre:"Non-fiction & Popular Science ",rating:4.8,reviews:4569,pages:320,publisher:"Bantam Books",publishedYear:1984,isbn:"9780553342536",language:"English",format:"Paperback",description:"John Gribbin’s book is a masterclass in making 'impossible' physics accessible. He takes the reader from the very first discoveries of the atom through the mind-bending realizations of the 20th century—specifically that at the subatomic level, things can be in two places at once, and particles are also waves.",isBestseller:!0,inStock:!0,stockCount:56,tags:["Quantum Mechanics","Particle Physics","Atomic Physics","History of Science"]},{id:175,title:"ENTANGLED LIFE",author:"Merlin Sheldrake",price:52.99,image:"https://i.pinimg.com/736x/cf/79/59/cf7959b86bd73bb0643c58edb6d5e08f.jpg",images:["https://i.pinimg.com/736x/cf/79/59/cf7959b86bd73bb0643c58edb6d5e08f.jpg"],category:"science",genre:"Non-fiction & Science",rating:4.8,reviews:4589,pages:368,publisher:"Random House",publishedYear:2020,isbn:"9780525510314",language:"English",format:"Paperback",description:"The book explores how fungi can survive in space, digest plastic, and even manipulate the behavior of insects (the 'zombie ant' fungus). Sheldrake argues that fungi challenge our very definition of 'individuality,'' as they exist in a constant state of relationship and flow. It’s a beautifully written blend of rigorous science and philosophical wonder that will change how you look at the ground beneath your feet.",isBestseller:!0,inStock:!0,stockCount:109,tags:["Mycology","Nature","Ecology","Biology"]},{id:176,title:"GODEN, ESCHER, BACH",author:"Douglas Hofstadter",price:16.99,image:"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1547125681i/24113.jpg",images:["https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1547125681i/24113.jpg"],category:"science",genre:"Non-fiction, Philosophy, Mathematics, Computer Science ",rating:4.8,reviews:6789,pages:777,publisher:"Basic Books",publishedYear:1979,isbn:"9780465026562",language:"English",format:"Paperback",description:"The book is famous for its unique structure: it alternates between technical chapters and fictional dialogues between characters like Achilles and the Tortoise. These dialogues are written in the style of musical forms (like a 'fugue' or a 'canon') and serve as playful allegories for the complex logical concepts discussed in the following chapters. It is widely considered one of the most influential books in the history of cognitive science and artificial intelligence.",isBestseller:!0,inStock:!0,stockCount:114,tags:["Recursion","Artificial Intelligence","Cognitive Science","Self-Reference"]},{id:177,title:"JELLYFISH AGE BACKWARDS",author:"Niklas Brendborg",price:14.99,image:"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1669668432i/58950706.jpg",images:["https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1669668432i/58950706.jpg"],category:"science",genre:"Science & Science Fiction",rating:4.7,reviews:4589,pages:320,publisher:"Hodder & Stoughton",publishedYear:2022,isbn:"9781529373905",language:"English",format:"Paperb
